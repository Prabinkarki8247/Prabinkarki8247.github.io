<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#081116">

<title>Resources and Vacancies | Prabin Karki</title>
<meta name="description" content="Public health job vacancies and resource materials shared by Prabin Karki.">
<style>
  
:root {
  --primary-color: #10243A;
  --secondary-color: #167D8D;
  --background-color: #081116;
  --surface-color: rgba(16, 36, 58, 0.82);
  --heading-color: #F7F8F5;
  --text-color: #D4DEDF;
  --accent-color: #D8B779;
  --border-color: rgba(120, 165, 170, 0.22);
  --hover-color: #116978;

  --bg: #081116;
  --ink: #F7F8F5;
  --mute: #B8C8CB;
  --acc: #167D8D;
  --sig: #D8B779;
  --line: rgba(120, 165, 170, 0.22);
  --shadow: 0 18px 45px rgba(0, 0, 0, 0.28);
  --on: #FFFFFF;
  --tint: rgba(22, 125, 141, 0.14);
  --card: rgba(16, 36, 58, 0.76);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  scroll-padding-top: 75px;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  overflow-x: hidden;
}

#tech-canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  pointer-events: none;
}

a {
  color: var(--acc);
  text-underline-offset: 4px;
}

a:hover {
  color: #b1f0ef;
}

:focus-visible {
  outline: 3px solid var(--sig);
  outline-offset: 4px;
}

h1, h2, h3 {
  font-family: Georgia, "Times New Roman", serif;
  line-height: 1.2;
  letter-spacing: -0.025em;
}

h1 {
  font-size: clamp(2rem, 5vw, 3rem);
  margin: 0 0 0.45rem;
}

h2 {
  font-size: 1.8rem;
  margin: 0 0 0.5rem;
}

h3 {
  font-size: 1.05rem;
  margin: 0.15rem 0 0.4rem;
}

p {
  max-width: 72ch;
  margin: 0 0 0.65rem;
}

.wrap {
  width: min(1100px, calc(100% - 2.5rem));
  margin: auto;
  position: relative;
  z-index: 1;
}

/* Navigation */

header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(8, 17, 22, 0.88);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line);
}

header .wrap {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 0.7rem;
  min-height: 62px;
  flex-wrap: wrap;
}

.brand {
  font: 700 1.2rem Georgia, serif;
  color: var(--ink);
  text-decoration: none;
  letter-spacing: -0.02em;
}

.brand span {
  color: var(--acc);
}

nav {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 0.35rem;
  flex-wrap: wrap;
  margin-left: auto;
}

nav a.nav-link {
  display: inline-flex;
  align-items: center;
  min-height: 34px;
  padding: 0.32rem 0.65rem;
  border: 1px solid transparent;
  border-radius: 8px;
  color: var(--mute);
  font-size: 0.85rem;
  text-decoration: none;
  transition: color 0.2s ease, background 0.2s ease, border-color 0.2s ease;
}

nav a.nav-link:hover,
nav a.nav-link[aria-current="page"] {
  color: #F7F8F5;
  background: rgba(22, 125, 141, 0.16);
  border-color: rgba(22, 125, 141, 0.42);
}

.glow-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
  padding: 0.48rem 0.8rem;
  color: #FFFFFF !important;
  background: linear-gradient(135deg, #167D8D, #116978);
  text-decoration: none;
  font-size: 0.84rem;
  font-weight: 700;
  white-space: nowrap;
  border-radius: 999px;
  border: 1px solid rgba(110, 210, 210, 0.4);
  box-shadow: 0 0 13px rgba(22, 125, 141, 0.28);
  transition: all 0.25s ease;
}

.glow-button:hover {
  color: #FFFFFF !important;
  background: linear-gradient(135deg, #1A91A0, #167D8D);
  box-shadow: 0 0 12px rgba(22, 125, 141, 0.5), 0 0 25px rgba(22, 125, 141, 0.2);
  transform: translateY(-2px);
}

/* Compact page layout */

main.wrap {
  padding-top: 0;
}

section {
  padding: 0.8rem 0;
  border-bottom: 1px solid var(--line);
}

.resources-intro {
  padding: 1.1rem 0 0.45rem;
}

.resources-intro .eyebrow {
  margin-bottom: 0.35rem;
}

.resources-intro h1 {
  margin-bottom: 0.35rem;
}

.resources-intro .lead {
  font-size: 0.98rem;
  line-height: 1.5;
  color: var(--mute);
  margin-bottom: 0;
  max-width: 70ch;
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 0.55rem;
  color: var(--acc);
  font-size: 0.75rem;
  font-weight: 750;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin: 0 0 0.5rem;
}

.eyebrow::before {
  content: "";
  width: 23px;
  height: 2px;
  background: var(--sig);
}

/* Tabs */

.tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin: 0.55rem 0 0.7rem;
  border-bottom: 1px solid var(--line);
  padding-bottom: 0.6rem;
}

.tab {
  padding: 0.42rem 0.85rem;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--card);
  color: var(--mute);
  font: inherit;
  font-size: 0.88rem;
  font-weight: 650;
  cursor: pointer;
  transition: all 0.2s ease;
}

.tab:hover,
.tab.on {
  color: var(--ink);
  background: rgba(22, 125, 141, 0.2);
  border-color: var(--acc);
}

/* Search bar */

.bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 0.65rem;
  margin: 0.65rem 0;
}

.bar input[type="search"] {
  flex: 1;
  min-width: 240px;
  padding: 0.55rem 0.8rem;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: rgba(8, 17, 22, 0.85);
  color: var(--ink);
  font: inherit;
  font-size: 0.9rem;
}

.bar input::placeholder {
  color: var(--mute);
  opacity: 0.8;
}

.chk {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  color: var(--mute);
  font-size: 0.85rem;
  cursor: pointer;
}

.chk input {
  accent-color: var(--acc);
  width: 15px;
  height: 15px;
}

/* Category filters */

.resource-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  margin: 0.55rem 0;
}

.resource-chip {
  padding: 0.28rem 0.68rem;
  border: 1px solid var(--line);
  border-radius: 99px;
  background: var(--card);
  color: var(--mute);
  font: inherit;
  font-size: 0.78rem;
  cursor: pointer;
}

.resource-chip:hover,
.resource-chip.on {
  color: var(--ink);
  background: var(--tint);
  border-color: var(--acc);
}

.resource-count {
  color: var(--mute);
  font-size: 0.82rem;
  margin: 0.4rem 0;
}

/* Resource cards — original design retained, dimensions reduced */

.resource-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 0.65rem;
  margin: 0.55rem 0 1rem;
  align-items: stretch;
}

.resource-card {
  display: flex;
  flex-direction: column;
  min-height: 0;
  padding: 0.85rem;
  background: var(--card);
  border: 1px solid var(--line);
  border-top: 3px solid var(--sig);
  border-radius: 13px;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
  backdrop-filter: blur(8px);
  transition: transform 0.2s ease, border-color 0.2s ease;
}

.resource-card:hover {
  transform: translateY(-4px);
  border-color: rgba(120, 209, 211, 0.45);
}

.resource-card.old {
  opacity: 0.7;
}

.resource-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.4rem;
  margin-bottom: 0.4rem;
}

.resource-tag {
  color: var(--sig);
  font-size: 0.7rem;
  font-weight: 750;
  letter-spacing: 0.07em;
  text-transform: uppercase;
}

.resource-badge {
  display: inline-block;
  padding: 0.16rem 0.5rem;
  border: 1px solid var(--line);
  border-radius: 99px;
  background: var(--tint);
  color: var(--acc);
  font-size: 0.7rem;
  font-weight: 650;
}

.resource-badge.soon {
  color: var(--sig);
  border-color: var(--sig);
}

.resource-card h3 {
  color: var(--ink);
  font-size: 1rem;
  line-height: 1.3;
  margin: 0.15rem 0 0.35rem;
}

.resource-card p {
  color: var(--mute);
  font-size: 0.85rem;
  line-height: 1.5;
  margin: 0 0 0.4rem;
}

.resource-org {
  color: var(--acc);
  font-size: 0.82rem;
  font-weight: 600;
  margin-bottom: 0.4rem;
}

.resource-foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin-top: auto;
  padding-top: 0.55rem;
}

.resource-deadline {
  color: var(--mute);
  font-size: 0.76rem;
}

.resource-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0.38rem 0.65rem;
  border: 1px solid var(--acc);
  border-radius: 8px;
  background: var(--acc);
  color: white !important;
  font-size: 0.76rem;
  font-weight: 700;
  text-decoration: none;
  transition: all 0.2s ease;
}

.resource-btn:hover {
  background: var(--hover-color);
  transform: translateY(-2px);
}

.resource-empty {
  grid-column: 1 / -1;
  color: var(--mute);
  padding: 1rem 0;
}

/* Footer */

footer {
  padding: 0.9rem 0 1.2rem;
  color: var(--mute);
  font-size: 0.82rem;
}

footer .wrap {
  display: flex;
  justify-content: space-between;
  gap: 0.7rem;
  flex-wrap: wrap;
}

/* Responsive layout */

@media (max-width: 850px) {
  .resource-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 650px) {
  .wrap {
    width: min(100% - 1.5rem, 1100px);
  }

  header .wrap {
    padding: 0.6rem 0;
  }

  nav {
    justify-content: flex-start;
    gap: 0.3rem;
    width: 100%;
    margin-left: 0;
  }

  nav a.nav-link {
    min-height: 32px;
    padding: 0.3rem 0.5rem;
    font-size: 0.8rem;
  }

  .glow-button {
    padding: 0.42rem 0.65rem;
    font-size: 0.8rem;
  }

  .resources-intro {
    padding: 0.8rem 0 0.35rem;
  }

  .resources-intro h1 {
    font-size: 2rem;
  }

  .resource-grid {
    grid-template-columns: 1fr;
    gap: 0.55rem;
  }

  .bar {
    align-items: stretch;
  }

  .bar input[type="search"] {
    min-width: 100%;
  }

  .resource-card {
    padding: 0.8rem;
  }
}

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }

  .resource-card,
  .resource-btn,
  nav a.nav-link,
  .glow-button {
    transition: none;
  }
}
</style>
</head>
<body>

<canvas id="tech-canvas" aria-hidden="true"></canvas>

<header>
  <div class="wrap">
    <a class="brand" href="index.html#top">
      Prabin <span>Karki</span>
    </a>

    <nav aria-label="Main navigation">
      <a class="nav-link" href="index.html#about">About</a>
      <a class="nav-link" href="index.html#portfolio">Portfolio</a>
      <a class="nav-link" href="cv.html">CV</a>
      <a class="nav-link" href="resources.html" aria-current="page">Resources</a>
      <a class="nav-link" href="index.html#contact">Contact</a>
      <a href="work_with_me.html" class="glow-button">
        Work with me <span>↗</span>
      </a>
    </nav>
  </div>
</header>

<main class="wrap">

  <div class="resources-intro">
    <p class="eyebrow">Knowledge & opportunities</p>
    <h1>Resources and vacancies</h1>
    <p class="lead">
      Job openings in public health and useful materials for epidemiology,
      surveillance, research, and public health practice.
    </p>
  </div>

  <div class="tabs" role="tablist" aria-label="Resource categories">
    <button class="tab on" role="tab" aria-selected="true" data-tab="vacancies">
      Vacancies
    </button>
    <button class="tab" role="tab" aria-selected="false" data-tab="materials">
      Resource materials
    </button>
  </div>

  <section id="vacancies">

    <div class="bar">
      <input
        type="search"
        id="vq"
        placeholder="Search vacancies (title, organization, place)"
        aria-label="Search vacancies"
      >

      <label class="chk">
        <input type="checkbox" id="hide" checked>
        Hide closed
      </label>
    </div>

    <div class="resource-chips" id="vchips"></div>
    <p class="resource-count" id="vcount"></p>
    <div class="resource-grid" id="vlist"></div>

  </section>

  <section id="materials" hidden>

    <div class="bar">
      <input
        type="search"
        id="mq"
        placeholder="Search resource materials"
        aria-label="Search materials"
      >
    </div>

    <div class="resource-chips" id="mchips"></div>
    <p class="resource-count" id="mcount"></p>
    <div class="resource-grid" id="mlist"></div>

  </section>

</main>

<footer>
  <div class="wrap">
    <span>© 2026 Prabin Karki</span>
    <span>Public health · Epidemiology · Research</span>
  </div>
</footer>

<script>
/* ===== GOOGLE SHEET LINKS ===== */

const SHEET_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTVsjpUwOQ9MeIoqpbZnZKxe-uSACQ6M1uohoNg0Rzg648ztQ4kPkhO59XyoHz6Vg/pub?output=csv";

const MAT_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTVsjpUwOQ9MeIoqpbZnZKxe-uSACQ6M1uohoNg0Rzg648ztQ4kPkhO59XyoHz6Vg/pub?gid=721912458&single=true&output=csv";

/* Backup lists. Leave them empty, the sheets fill the page. */

let VAC = [];
let MAT = [];

const $ = s => document.querySelector(s);

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
  "&": "&amp;",
  "<": "&lt;",
  ">": "&gt;",
  '"': "&quot;",
  "'": "&#39;"
}[c]));

const safe = u =>
  /^(https?:\/\/|files\/|[\w.\-\/]+\.(pdf|docx?|xlsx?))/i.test(u || "")
    ? u
    : "";

const daysLeft = d => {
  if (!d) return null;
  const e = new Date(d + "T23:59:59");
  return isNaN(e) ? null : Math.ceil((e - new Date()) / 864e5);
};

const fmt = d =>
  new Date(d + "T00:00:00").toLocaleDateString("en-GB", {
    day: "numeric",
    month: "short",
    year: "numeric"
  });

function chips(box, list, cur, cb) {
  box.innerHTML = ["All"].concat(list).map(c =>
    `<button class="resource-chip${c === cur ? " on" : ""}" data-c="${esc(c)}">${esc(c)}</button>`
  ).join("");

  box.onclick = e => {
    const b = e.target.closest("[data-c]");
    if (b) cb(b.dataset.c);
  };
}

const uniq = a => [...new Set(a.filter(Boolean))];

/* ===== VACANCIES ===== */

let vt = "All";

function vac() {
  const q = $("#vq").value.trim().toLowerCase();
  const hide = $("#hide").checked;

  chips($("#vchips"), uniq(VAC.map(v => v.type)), vt, c => {
    vt = c;
    vac();
  });

  const rows = VAC.map(v => ({
    v,
    d: daysLeft(v.deadline)
  }))
  .filter(x =>
    (vt === "All" || x.v.type === vt) &&
    (!hide || x.d === null || x.d >= 0) &&
    (!q || [x.v.title, x.v.org, x.v.loc, x.v.note].join(" ").toLowerCase().includes(q))
  )
  .sort((a, b) =>
    (a.d === null) - (b.d === null) ||
    (a.d < 0) - (b.d < 0) ||
    (a.d - b.d)
  );

  $("#vcount").textContent =
    rows.length + (rows.length === 1 ? " vacancy" : " vacancies");

  $("#vlist").innerHTML = rows.length
    ? rows.map(({v, d}) => {
        const closed = d !== null && d < 0;

        const badge = v.example
          ? `<span class="resource-badge">Example</span>`
          : closed
            ? `<span class="resource-badge">Closed</span>`
            : d === null
              ? `<span class="resource-badge">Open until filled</span>`
              : `<span class="resource-badge${d <= 7 ? " soon" : ""}">${d === 0 ? "Last day" : d + " days left"}</span>`;

        const u = safe(v.url);

        return `
          <article class="resource-card${closed ? " old" : ""}">
            <div class="resource-top">
              <span class="resource-tag">${esc(v.type)}</span>
              ${badge}
            </div>

            <h3>${esc(v.title)}</h3>

            <div class="resource-org">
              ${esc(v.org)}${v.loc ? ", " + esc(v.loc) : ""}
            </div>

            ${v.note ? `<p>${esc(v.note)}</p>` : ""}

            <div class="resource-foot">
              <span class="resource-deadline">
                ${v.deadline ? "Deadline: " + esc(fmt(v.deadline)) : "No deadline listed"}
              </span>

              ${u ? `<a class="resource-btn" href="${esc(u)}" target="_blank" rel="noopener noreferrer">View advertisement ↗</a>` : ""}
            </div>
          </article>
        `;
      }).join("")
    : `<p class="resource-empty">No vacancies match right now. Check back soon, or untick “Hide closed”.</p>`;
}

$("#vq").addEventListener("input", vac);
$("#hide").addEventListener("change", vac);

/* ===== RESOURCE MATERIALS ===== */

let mt = "All";

function mat() {
  const q = $("#mq").value.trim().toLowerCase();

  chips($("#mchips"), uniq(MAT.map(m => m.cat)), mt, c => {
    mt = c;
    mat();
  });

  const rows = MAT.filter(m =>
    (mt === "All" || m.cat === mt) &&
    (!q || [m.title, m.desc, m.cat].join(" ").toLowerCase().includes(q))
  );

  $("#mcount").textContent =
    rows.length + (rows.length === 1 ? " resource" : " resources");

  $("#mlist").innerHTML = rows.length
    ? rows.map(m => {
        const u = safe(m.url);

        return `
          <article class="resource-card">
            <div class="resource-top">
              <span class="resource-tag">${esc(m.cat)}</span>
              <span class="resource-badge">${esc(m.kind || "Link")}</span>
            </div>

            <h3>${esc(m.title)}</h3>
            <p>${esc(m.desc)}</p>

            <div class="resource-foot">
              <span></span>

              ${u ? `
                <a class="resource-btn"
                   href="${esc(u)}"
                   target="_blank"
                   rel="noopener noreferrer"
                   ${m.kind === "PDF" ? "download" : ""}>
                  ${m.kind === "PDF" ? "Download ↓" : "Open ↗"}
                </a>
              ` : ""}
            </div>
          </article>
        `;
      }).join("")
    : `<p class="resource-empty">No resources match your search.</p>`;
}

$("#mq").addEventListener("input", mat);

/* ===== TABS ===== */

function tab(id) {
  if (id !== "materials") id = "vacancies";

  ["vacancies", "materials"].forEach(t => {
    $("#" + t).hidden = t !== id;
  });

  document.querySelectorAll(".tab").forEach(b => {
    const active = b.dataset.tab === id;
    b.classList.toggle("on", active);
    b.setAttribute("aria-selected", active ? "true" : "false");
  });
}

document.querySelector(".tabs").addEventListener("click", e => {
  const b = e.target.closest("[data-tab]");
  if (b) {
    location.hash = b.dataset.tab;
  }
});

addEventListener("hashchange", () => {
  tab(location.hash.slice(1));
});

/* ===== GOOGLE SHEETS LOADER ===== */

function csv(t) {
  const r = [];
  let w = [], c = "", q = false;

  for (let i = 0; i < t.length; i++) {
    const h = t[i];

    if (q) {
      if (h === '"') {
        if (t[i + 1] === '"') {
          c += '"';
          i++;
        } else {
          q = false;
        }
      } else {
        c += h;
      }
    } else if (h === '"') {
      q = true;
    } else if (h === ",") {
      w.push(c);
      c = "";
    } else if (h === "\n" || h === "\r") {
      if (h === "\r" && t[i + 1] === "\n") i++;
      w.push(c);
      r.push(w);
      w = [];
      c = "";
    } else {
      c += h;
    }
  }

  if (c || w.length) {
    w.push(c);
    r.push(w);
  }

  return r;
}

async function grab(url) {
  const response = await fetch(url);

  if (!response.ok) {
    throw new Error("Could not load spreadsheet");
  }

  const rows = csv(await response.text());
  const H = rows[0].map(x => x.trim().toLowerCase());

  return rows.slice(1)
    .map(r => k => (r[H.indexOf(k)] || "").trim())
    .filter(g => g("title"));
}

async function load() {
  if (SHEET_CSV) {
    try {
      const v = (await grab(SHEET_CSV)).map(g => ({
        title: g("title"),
        org: g("organization"),
        loc: g("location"),
        type: g("type") || "Other",
        deadline: g("deadline"),
        url: g("url"),
        note: g("note")
      }));

      if (v.length) VAC = v;
    } catch (e) {
      console.error("Vacancies could not be loaded:", e);
    }
  }

  if (MAT_CSV) {
    try {
      const m = (await grab(MAT_CSV)).map(g => ({
        title: g("title"),
        cat: g("category") || "Other",
        kind: g("type") || "Link",
        url: g("url"),
        desc: g("description")
      }));

      if (m.length) MAT = m;
    } catch (e) {
      console.error("Resources could not be loaded:", e);
    }
  }

  vac();
  mat();
  tab(location.hash.slice(1));
}

load();

/* ===== ANIMATED CIRCUIT BACKGROUND ===== */

(function() {
  var cv = $("#tech-canvas");
  var ctx = cv.getContext("2d");
  var off = document.createElement("canvas");
  var o = off.getContext("2d");

  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var W, H, dpr;
  var paths = [], pulses = [], ch = {}, run = true;

  var D = [
    [1,0],[.7071,.7071],[0,1],[-.7071,.7071],
    [-1,0],[-.7071,-.7071],[0,-1],[.7071,-.7071]
  ];

  var OR = ["#ff7a1a","#ff9a2e","#ffb347"];
  var CY = "#22c3e6";

  function r(a,b) {
    return a + Math.random() * (b-a);
  }

  function build() {
    paths = [];
    pulses = [];

    var cx = W * (W > 800 ? .68 : .5);
    var cy = H * .42;
    var u = Math.min(W,H) / 900;

    ch = {x:cx,y:cy,u:u};

    for (var k=0;k<8;k++) {
      var tr = 2 + Math.floor(Math.random()*2);

      for (var t=0;t<tr;t++) {
        var col = Math.random()<.34 ? CY : OR[Math.floor(Math.random()*3)];
        var lan = 1 + Math.floor(Math.random()*3);
        var st = [], d = k;

        for (var i=0;i<16;i++) {
          st.push([d,r(50,170)]);
          d = (k + Math.floor(r(-1,2)) + 8) % 8;
        }

        var base = r(-30,30)*u;

        for (var l=0;l<lan;l++) {
          var lo = base+l*9;
          var nx = -D[k][1], ny = D[k][0];
          var px = cx+nx*lo+D[k][0]*30*u;
          var py = cy+ny*lo+D[k][1]*30*u;
          var pts = [[px,py]], len = [0], tot = 0;

          for (var s=0;s<st.length;s++) {
            var dx = D[st[s][0]][0]*st[s][1];
            var dy = D[st[s][0]][1]*st[s][1];

            px += dx;
            py += dy;
            tot += Math.hypot(dx,dy);

            pts.push([px,py]);
            len.push(tot);

            if (px<-60||px>W+60||py<-60||py>H+60) break;
          }

          var p = {
            pts:pts,
            len:len,
            tot:tot,
            col:col,
            w:l?1.1:1.8
          };

          paths.push(p);

          if (Math.random()<.8) {
            pulses.push({p:p,s:-r(0,tot),v:r(1.2,3)});
          }
        }
      }
    }
  }

  function poly(c,a) {
    c.beginPath();
    c.moveTo(a[0][0],a[0][1]);

    for (var i=1;i<a.length;i++) {
      c.lineTo(a[i][0],a[i][1]);
    }

    c.closePath();
  }

  function chip(c,x,y,u) {
    var w=130*u,h=70*u,t=34*u;

    function top(f) {
      return [
        [x,y-h*f],
        [x+w*f,y],
        [x,y+h*f],
        [x-w*f,y]
      ];
    }

    var T=top(1);

    c.shadowColor="#ff7a1a";
    c.shadowBlur=24;

    poly(c,[
      T[3],T[2],T[1],
      [T[1][0],T[1][1]+t],
      [T[2][0],T[2][1]+t],
      [T[3][0],T[3][1]+t]
    ]);

    c.fillStyle="#16233a";
    c.fill();
    c.strokeStyle="#ff7a1a";
    c.lineWidth=1.6;
    c.stroke();

    poly(c,T);
    c.fillStyle="#1c3050";
    c.fill();

    c.shadowColor="#4aa8e8";
    c.shadowBlur=10;
    c.strokeStyle="#5aa0d8";
    c.lineWidth=1.2;
    c.stroke();

    c.shadowColor="#ffb347";
    c.shadowBlur=8;
    c.strokeStyle="#ffb347";
    c.lineWidth=1;

    poly(c,top(.55));
    c.stroke();

    c.shadowBlur=0;
  }

  function stat() {
    o.setTransform(dpr,0,0,dpr,0,0);

    var g=o.createLinearGradient(0,0,W,H);
    g.addColorStop(0,"#2b3b50");
    g.addColorStop(.45,"#101c2e");
    g.addColorStop(1,"#070d18");

    o.fillStyle=g;
    o.fillRect(0,0,W,H);
    o.lineJoin=o.lineCap="round";

    paths.forEach(function(p) {
      o.beginPath();

      p.pts.forEach(function(q,i) {
        i ? o.lineTo(q[0],q[1]) : o.moveTo(q[0],q[1]);
      });

      o.strokeStyle=p.col;
      o.globalAlpha=.55;
      o.lineWidth=p.w;
      o.shadowColor=p.col;
      o.shadowBlur=8;
      o.stroke();
    });

    o.globalAlpha=1;
    o.shadowBlur=0;

    chip(o,ch.x,ch.y,ch.u);

    o.shadowBlur=0;
    o.fillStyle="rgba(8,17,22,.45)";
    o.fillRect(0,0,W,H);
  }

  function at(p,s) {
    if(s<0) return null;
    if(s>=p.tot) return p.pts[p.pts.length-1];

    for(var i=1;i<p.len.length;i++) {
      if(p.len[i]>=s) {
        var f=(s-p.len[i-1])/(p.len[i]-p.len[i-1]);
        var a=p.pts[i-1],b=p.pts[i];

        return [
          a[0]+(b[0]-a[0])*f,
          a[1]+(b[1]-a[1])*f
        ];
      }
    }

    return p.pts[p.pts.length-1];
  }

  function pulse(q) {
    q.s+=q.v;

    if(q.s>q.p.tot+70) {
      q.s=-r(0,300);
      q.v=r(1.2,3);
    }

    if(q.s<0) return;

    for(var i=0;i<12;i++) {
      var pt=at(q.p,q.s-i*6);
      if(!pt) continue;

      ctx.globalAlpha=(1-i/12)*.9;
      ctx.fillStyle=i?q.p.col:"#fff";
      ctx.shadowColor=q.p.col;
      ctx.shadowBlur=i<2?14:0;

      ctx.beginPath();
      ctx.arc(pt[0],pt[1],2.4*(1-i/14)+.4,0,6.283);
      ctx.fill();
    }

    ctx.globalAlpha=1;
    ctx.shadowBlur=0;
  }

  function frame() {
    if(run) {
      ctx.setTransform(1,0,0,1,0,0);
      ctx.drawImage(off,0,0);
      ctx.setTransform(dpr,0,0,dpr,0,0);
      pulses.forEach(pulse);
    }

    requestAnimationFrame(frame);
  }

  function size() {
    dpr=Math.min(devicePixelRatio||1,2);
    W=innerWidth;
    H=innerHeight;

    cv.width=off.width=W*dpr;
    cv.height=off.height=H*dpr;

    build();
    stat();

    if(reduce) {
      ctx.setTransform(1,0,0,1,0,0);
      ctx.drawImage(off,0,0);
    }
  }

  addEventListener("resize",size);

  document.addEventListener("visibilitychange",function() {
    run=!document.hidden;
  });

  size();

  if(!reduce) frame();
})();
</script>

</body>
</html>
