
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#081116">

<title>Resources and Vacancies | Prabin Karki</title>
<meta name="description" content="Public health job vacancies and resource materials shared by Prabin Karki.">

<link rel="stylesheet" href="style.css">

<style>
[hidden] {
  display: none !important;
}

/* Resources page layout */
.resources-intro {
  padding: 3.5rem 0 1.5rem;
}

.resources-intro .lead {
  max-width: 70ch;
}

.tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  border-bottom: 1px solid var(--line);
  margin: 1.5rem 0;
}

.tab {
  background: none;
  border: 0;
  border-bottom: 3px solid transparent;
  color: var(--mute);
  font: inherit;
  font-weight: 650;
  padding: 0.7rem 1.1rem;
  cursor: pointer;
}

.tab:hover,
.tab.on {
  color: var(--acc);
}

.tab.on {
  border-bottom-color: var(--sig);
}

.bar {
  display: flex;
  flex-wrap: wrap;
  gap: 0.7rem 1rem;
  align-items: center;
  margin-bottom: 1rem;
}

.bar input[type="search"] {
  flex: 1;
  min-width: 220px;
  max-width: 420px;
  font: inherit;
  padding: 0.65rem 0.9rem;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--card);
  color: var(--ink);
}

.bar input[type="search"]::placeholder {
  color: var(--mute);
}

label.chk {
  color: var(--mute);
  font-size: 0.92rem;
  display: flex;
  gap: 0.45rem;
  align-items: center;
  cursor: pointer;
}

.resource-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 0.55rem;
  margin: 0 0 1.2rem;
}

.resource-chip {
  background: var(--tint);
  border: 1px solid var(--line);
  color: var(--mute);
  padding: 0.35rem 0.85rem;
  border-radius: 99px;
  font: inherit;
  font-size: 0.88rem;
  cursor: pointer;
}

.resource-chip:hover,
.resource-chip.on {
  background: var(--acc);
  border-color: var(--acc);
  color: #FFFFFF;
}

.resource-count {
  color: var(--mute);
  font-size: 0.92rem;
  margin-bottom: 1rem;
}

.resource-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 1.15rem;
  margin: 1rem 0 3rem;
}

.resource-card {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 220px;
  padding: 1.35rem;
  background: var(--card);
  border: 1px solid var(--line);
  border-top: 3px solid var(--sig);
  border-radius: 13px;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
  backdrop-filter: blur(8px);
  transition: transform 0.2s ease, border-color 0.2s ease;
}

.resource-card:hover {
  transform: translateY(-4px);
  border-color: rgba(120, 209, 211, 0.45);
}

.resource-card.old {
  opacity: 0.55;
  border-top-color: var(--line);
}

.resource-card h3 {
  margin: 0.3rem 0 0.65rem;
}

.resource-card p {
  color: var(--mute);
  font-size: 0.95rem;
  margin-bottom: 0.9rem;
}

.resource-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin-bottom: 0.65rem;
}

.resource-tag {
  color: var(--mute);
  font-size: 0.82rem;
}

.resource-badge {
  font-size: 0.76rem;
  font-weight: 700;
  padding: 0.18rem 0.6rem;
  border-radius: 99px;
  background: var(--tint);
  color: var(--acc);
  white-space: nowrap;
}

.resource-badge.soon {
  background: var(--sig);
  color: #081116;
}

.resource-org {
  color: var(--acc);
  font-size: 0.95rem;
  margin-bottom: 0.65rem;
}

.resource-foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.7rem;
  margin-top: auto;
  padding-top: 0.8rem;
}

.resource-deadline {
  color: var(--mute);
  font-size: 0.84rem;
}

.resource-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0.48rem 0.9rem;
  border-radius: 8px;
  border: 1px solid var(--acc);
  color: var(--acc);
  text-decoration: none;
  font-size: 0.9rem;
  font-weight: 700;
}

.resource-btn:hover {
  background: var(--acc);
  color: #FFFFFF;
}

.resource-empty {
  color: var(--mute);
  padding: 1rem 0 3rem;
}

@media (max-width: 850px) {
  .resource-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 650px) {
  .resource-grid {
    grid-template-columns: 1fr;
  }

  .resource-card {
    min-height: 0;
  }

  .bar input[type="search"] {
    max-width: none;
    width: 100%;
  }

  .resource-foot {
    align-items: flex-start;
  }
}

@media (prefers-reduced-motion: reduce) {
  .resource-card {
    transition: none;
  }
}
</style>
</head>

<body>

<canvas id="tech-canvas" aria-hidden="true"></canvas>

<header>
  <div class="wrap">
    <a class="brand" href="index.html#top">
      Prabin <span>Karki</span>
    </a>

    <nav aria-label="Main navigation">
      <a class="nav-link" href="index.html#about">About</a>

      </a>
    </nav>

</header>

<main class="wrap">

  <div class="resources-intro">
    <p class="eyebrow">Knowledge & opportunities</p>
    <h1>Resources and vacancies</h1>
    <p class="lead">
      Job openings in public health and useful materials for epidemiology,

    </p>
  </div>

  <div class="tabs" role="tablist" aria-label="Resource categories">
    <button class="tab on" role="tab" aria-selected="true" data-tab="vacancies">

    </button>

  <section id="vacancies">

    <div class="resource-chips" id="vchips"></div>

    <div class="resource-grid" id="vlist"></div>

  </section>

  <section id="materials" hidden>

    <div class="bar">
      <input
        type="search"
        id="mq"
        placeholder="Search resource materials"
        aria-label="Search materials"
      >
    </div>

    <div class="resource-chips" id="mchips"></div>
    <p class="resource-count" id="mcount"></p>
    <div class="resource-grid" id="mlist"></div>

  </section>

</main>

<footer>
  <div class="wrap">
    <span>© 2026 Prabin Karki</span>
    <span>Public health · Epidemiology · Research</span>
  </div>
</footer>

<script>
/* ===== GOOGLE SHEET LINKS ===== */

const SHEET_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTVsjpUwOQ9MeIoqpbZnZKxe-uSACQ6M1uohoNg0Rzg648ztQ4kPkhO59XyoHz6Vg/pub?output=csv";

const MAT_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTVsjpUwOQ9MeIoqpbZnZKxe-uSACQ6M1uohoNg0Rzg648ztQ4kPkhO59XyoHz6Vg/pub?gid=721912458&single=true&output=csv";

/* Backup lists. Leave them empty, the sheets fill the page. */

let VAC = [];
let MAT = [];

const $ = s => document.querySelector(s);

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
  "&": "&amp;",
  "<": "&lt;",
  ">": "&gt;",
  '"': "&quot;",
  "'": "&#39;"
}[c]));

const safe = u =>
  /^(https?:\/\/|files\/|[\w.\-\/]+\.(pdf|docx?|xlsx?))/i.test(u || "")
    ? u
    : "";

const daysLeft = d => {
  if (!d) return null;
  const e = new Date(d + "T23:59:59");
  return isNaN(e) ? null : Math.ceil((e - new Date()) / 864e5);
};

const fmt = d =>
  new Date(d + "T00:00:00").toLocaleDateString("en-GB", {
    day: "numeric",
    month: "short",
    year: "numeric"
  });

function chips(box, list, cur, cb) {
  box.innerHTML = ["All"].concat(list).map(c =>
    `<button class="resource-chip${c === cur ? " on" : ""}" data-c="${esc(c)}">${esc(c)}</button>`
  ).join("");

  box.onclick = e => {
    const b = e.target.closest("[data-c]");
    if (b) cb(b.dataset.c);
  };
}

const uniq = a => [...new Set(a.filter(Boolean))];

/* ===== VACANCIES ===== */

let vt = "All";

function vac() {
  const q = $("#vq").value.trim().toLowerCase();
  const hide = $("#hide").checked;

  chips($("#vchips"), uniq(VAC.map(v => v.type)), vt, c => {
    vt = c;
    vac();
  });

  const rows = VAC.map(v => ({
    v,
    d: daysLeft(v.deadline)
  }))
  .filter(x =>
    (vt === "All" || x.v.type === vt) &&
    (!hide || x.d === null || x.d >= 0) &&
    (!q || [x.v.title, x.v.org, x.v.loc, x.v.note].join(" ").toLowerCase().includes(q))
  )
  .sort((a, b) =>
    (a.d === null) - (b.d === null) ||
    (a.d < 0) - (b.d < 0) ||
    (a.d - b.d)
  );

  $("#vcount").textContent =
    rows.length + (rows.length === 1 ? " vacancy" : " vacancies");

  $("#vlist").innerHTML = rows.length
    ? rows.map(({v, d}) => {
        const closed = d !== null && d < 0;

        const badge = v.example
          ? `<span class="resource-badge">Example</span>`
          : closed
            ? `<span class="resource-badge">Closed</span>`
            : d === null
              ? `<span class="resource-badge">Open until filled</span>`
              : `<span class="resource-badge${d <= 7 ? " soon" : ""}">${d === 0 ? "Last day" : d + " days left"}</span>`;

        const u = safe(v.url);

        return `
          <article class="resource-card${closed ? " old" : ""}">
            <div class="resource-top">
              <span class="resource-tag">${esc(v.type)}</span>
              ${badge}
            </div>

            <h3>${esc(v.title)}</h3>

            <div class="resource-org">
              ${esc(v.org)}${v.loc ? ", " + esc(v.loc) : ""}
            </div>

            ${v.note ? `<p>${esc(v.note)}</p>` : ""}

            <div class="resource-foot">
              <span class="resource-deadline">
                ${v.deadline ? "Deadline: " + esc(fmt(v.deadline)) : "No deadline listed"}
              </span>

              ${u ? `<a class="resource-btn" href="${esc(u)}" target="_blank" rel="noopener noreferrer">View advertisement ↗</a>` : ""}
            </div>
          </article>
        `;
      }).join("")
    : `<p class="resource-empty">No vacancies match right now. Check back soon, or untick “Hide closed”.</p>`;
}

$("#vq").addEventListener("input", vac);
$("#hide").addEventListener("change", vac);

/* ===== RESOURCE MATERIALS ===== */

let mt = "All";

function mat() {
  const q = $("#mq").value.trim().toLowerCase();

  chips($("#mchips"), uniq(MAT.map(m => m.cat)), mt, c => {
    mt = c;
    mat();
  });

  const rows = MAT.filter(m =>
    (mt === "All" || m.cat === mt) &&
    (!q || [m.title, m.desc, m.cat].join(" ").toLowerCase().includes(q))
  );

  $("#mcount").textContent =
    rows.length + (rows.length === 1 ? " resource" : " resources");

  $("#mlist").innerHTML = rows.length
    ? rows.map(m => {
        const u = safe(m.url);

        return `
          <article class="resource-card">
            <div class="resource-top">
              <span class="resource-tag">${esc(m.cat)}</span>
              <span class="resource-badge">${esc(m.kind || "Link")}</span>
            </div>

            <h3>${esc(m.title)}</h3>
            <p>${esc(m.desc)}</p>

            <div class="resource-foot">
              <span></span>

              ${u ? `
                <a class="resource-btn"
                   href="${esc(u)}"
                   target="_blank"
                   rel="noopener noreferrer"
                   ${m.kind === "PDF" ? "download" : ""}>
                  ${m.kind === "PDF" ? "Download ↓" : "Open ↗"}
                </a>
              ` : ""}
            </div>
          </article>
        `;
      }).join("")
    : `<p class="resource-empty">No resources match your search.</p>`;
}

$("#mq").addEventListener("input", mat);

/* ===== TABS ===== */

function tab(id) {
  if (id !== "materials") id = "vacancies";

  ["vacancies", "materials"].forEach(t => {
    $("#" + t).hidden = t !== id;
  });

  document.querySelectorAll(".tab").forEach(b => {
    const active = b.dataset.tab === id;
    b.classList.toggle("on", active);
    b.setAttribute("aria-selected", active ? "true" : "false");
  });
}

document.querySelector(".tabs").addEventListener("click", e => {
  const b = e.target.closest("[data-tab]");
  if (b) {
    location.hash = b.dataset.tab;
  }
});

addEventListener("hashchange", () => {
  tab(location.hash.slice(1));
});

/* ===== GOOGLE SHEETS LOADER ===== */

function csv(t) {
  const r = [];
  let w = [], c = "", q = false;

  for (let i = 0; i < t.length; i++) {
    const h = t[i];

    if (q) {
      if (h === '"') {
        if (t[i + 1] === '"') {
          c += '"';
          i++;
        } else {
          q = false;
        }
      } else {
        c += h;
      }
    } else if (h === '"') {
      q = true;
    } else if (h === ",") {
      w.push(c);
      c = "";
    } else if (h === "\n" || h === "\r") {
      if (h === "\r" && t[i + 1] === "\n") i++;
      w.push(c);
      r.push(w);
      w = [];
      c = "";
    } else {
      c += h;
    }
  }

  if (c || w.length) {
    w.push(c);
    r.push(w);
  }

  return r;
}

async function grab(url) {
  const response = await fetch(url);

  if (!response.ok) {
    throw new Error("Could not load spreadsheet");
  }

  const rows = csv(await response.text());
  const H = rows[0].map(x => x.trim().toLowerCase());

  return rows.slice(1)
    .map(r => k => (r[H.indexOf(k)] || "").trim())
    .filter(g => g("title"));
}

async function load() {
  if (SHEET_CSV) {
    try {
      const v = (await grab(SHEET_CSV)).map(g => ({
        title: g("title"),
        org: g("organization"),
        loc: g("location"),
        type: g("type") || "Other",
        deadline: g("deadline"),
        url: g("url"),
        note: g("note")
      }));

      if (v.length) VAC = v;
    } catch (e) {
      console.error("Vacancies could not be loaded:", e);
    }
  }

  if (MAT_CSV) {
    try {
      const m = (await grab(MAT_CSV)).map(g => ({
        title: g("title"),
        cat: g("category") || "Other",
        kind: g("type") || "Link",
        url: g("url"),
        desc: g("description")
      }));

      if (m.length) MAT = m;
    } catch (e) {
      console.error("Resources could not be loaded:", e);
    }
  }

  vac();
  mat();
  tab(location.hash.slice(1));
}

load();

/* ===== ANIMATED CIRCUIT BACKGROUND ===== */

(function() {
  var cv = $("#tech-canvas");
  var ctx = cv.getContext("2d");
  var off = document.createElement("canvas");
  var o = off.getContext("2d");

  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var W, H, dpr;
  var paths = [], pulses = [], ch = {}, run = true;

  var D = [
    [1,0],[.7071,.7071],[0,1],[-.7071,.7071],
    [-1,0],[-.7071,-.7071],[0,-1],[.7071,-.7071]
  ];

  var OR = ["#ff7a1a","#ff9a2e","#ffb347"];
  var CY = "#22c3e6";

  function r(a,b) {
    return a + Math.random() * (b-a);
  }

  function build() {
    paths = [];
    pulses = [];

    var cx = W * (W > 800 ? .68 : .5);
    var cy = H * .42;
    var u = Math.min(W,H) / 900;

    ch = {x:cx,y:cy,u:u};

    for (var k=0;k<8;k++) {
      var tr = 2 + Math.floor(Math.random()*2);

      for (var t=0;t<tr;t++) {
        var col = Math.random()<.34 ? CY : OR[Math.floor(Math.random()*3)];
        var lan = 1 + Math.floor(Math.random()*3);
        var st = [], d = k;

        for (var i=0;i<16;i++) {
          st.push([d,r(50,170)]);
          d = (k + Math.floor(r(-1,2)) + 8) % 8;
        }

        var base = r(-30,30)*u;

        for (var l=0;l<lan;l++) {
          var lo = base+l*9;
          var nx = -D[k][1], ny = D[k][0];
          var px = cx+nx*lo+D[k][0]*30*u;
          var py = cy+ny*lo+D[k][1]*30*u;
          var pts = [[px,py]], len = [0], tot = 0;

          for (var s=0;s<st.length;s++) {
            var dx = D[st[s][0]][0]*st[s][1];
            var dy = D[st[s][0]][1]*st[s][1];

            px += dx;
            py += dy;
            tot += Math.hypot(dx,dy);

            pts.push([px,py]);
            len.push(tot);

            if (px<-60||px>W+60||py<-60||py>H+60) break;
          }

          var p = {
            pts:pts,
            len:len,
            tot:tot,
            col:col,
            w:l?1.1:1.8
          };

          paths.push(p);

          if (Math.random()<.8) {
            pulses.push({p:p,s:-r(0,tot),v:r(1.2,3)});
          }
        }
      }
    }
  }

  function poly(c,a) {
    c.beginPath();
    c.moveTo(a[0][0],a[0][1]);

    for (var i=1;i<a.length;i++) {
      c.lineTo(a[i][0],a[i][1]);
    }

    c.closePath();
  }

  function chip(c,x,y,u) {
    var w=130*u,h=70*u,t=34*u;

    function top(f) {
      return [
        [x,y-h*f],
        [x+w*f,y],
        [x,y+h*f],
        [x-w*f,y]
      ];
    }

    var T=top(1);

    c.shadowColor="#ff7a1a";
    c.shadowBlur=24;

    poly(c,[
      T[3],T[2],T[1],
      [T[1][0],T[1][1]+t],
      [T[2][0],T[2][1]+t],
      [T[3][0],T[3][1]+t]
    ]);

    c.fillStyle="#16233a";
    c.fill();
    c.strokeStyle="#ff7a1a";
    c.lineWidth=1.6;
    c.stroke();

    poly(c,T);
    c.fillStyle="#1c3050";
    c.fill();

    c.shadowColor="#4aa8e8";
    c.shadowBlur=10;
    c.strokeStyle="#5aa0d8";
    c.lineWidth=1.2;
    c.stroke();

    c.shadowColor="#ffb347";
    c.shadowBlur=8;
    c.strokeStyle="#ffb347";
    c.lineWidth=1;

    poly(c,top(.55));
    c.stroke();

    c.shadowBlur=0;
  }

  function stat() {
    o.setTransform(dpr,0,0,dpr,0,0);

    var g=o.createLinearGradient(0,0,W,H);
    g.addColorStop(0,"#2b3b50");
    g.addColorStop(.45,"#101c2e");
    g.addColorStop(1,"#070d18");

    o.fillStyle=g;
    o.fillRect(0,0,W,H);
    o.lineJoin=o.lineCap="round";

    paths.forEach(function(p) {
      o.beginPath();

      p.pts.forEach(function(q,i) {
        i ? o.lineTo(q[0],q[1]) : o.moveTo(q[0],q[1]);
      });

      o.strokeStyle=p.col;
      o.globalAlpha=.55;
      o.lineWidth=p.w;
      o.shadowColor=p.col;
      o.shadowBlur=8;
      o.stroke();
    });

    o.globalAlpha=1;
    o.shadowBlur=0;

    chip(o,ch.x,ch.y,ch.u);

    o.shadowBlur=0;
    o.fillStyle="rgba(8,17,22,.45)";
    o.fillRect(0,0,W,H);
  }

  function at(p,s) {
    if(s<0) return null;
    if(s>=p.tot) return p.pts[p.pts.length-1];

    for(var i=1;i<p.len.length;i++) {
      if(p.len[i]>=s) {
        var f=(s-p.len[i-1])/(p.len[i]-p.len[i-1]);
        var a=p.pts[i-1],b=p.pts[i];

        return [
          a[0]+(b[0]-a[0])*f,
          a[1]+(b[1]-a[1])*f
        ];
      }
    }

    return p.pts[p.pts.length-1];
  }

  function pulse(q) {
    q.s+=q.v;

    if(q.s>q.p.tot+70) {
      q.s=-r(0,300);
      q.v=r(1.2,3);
    }

    if(q.s<0) return;

    for(var i=0;i<12;i++) {
      var pt=at(q.p,q.s-i*6);
      if(!pt) continue;

      ctx.globalAlpha=(1-i/12)*.9;
      ctx.fillStyle=i?q.p.col:"#fff";
      ctx.shadowColor=q.p.col;
      ctx.shadowBlur=i<2?14:0;

      ctx.beginPath();
      ctx.arc(pt[0],pt[1],2.4*(1-i/14)+.4,0,6.283);
      ctx.fill();
    }

    ctx.globalAlpha=1;
    ctx.shadowBlur=0;
  }

  function frame() {
    if(run) {
      ctx.setTransform(1,0,0,1,0,0);
      ctx.drawImage(off,0,0);
      ctx.setTransform(dpr,0,0,dpr,0,0);
      pulses.forEach(pulse);
    }

    requestAnimationFrame(frame);
  }

  function size() {
    dpr=Math.min(devicePixelRatio||1,2);
    W=innerWidth;
    H=innerHeight;

    cv.width=off.width=W*dpr;
    cv.height=off.height=H*dpr;

    build();
    stat();

    if(reduce) {
      ctx.setTransform(1,0,0,1,0,0);
      ctx.drawImage(off,0,0);
    }
  }

  addEventListener("resize",size);

  document.addEventListener("visibilitychange",function() {
    run=!document.hidden;
  });

  size();

  if(!reduce) frame();
})();
</script>

</body>
</html>
